name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Varredura semanal: pega vulnerabilidades novas mesmo sem commit.
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analisar:
    name: Análise de segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      # build-mode: none analisa o código-fonte direto, sem compilar o Next.
      - name: Iniciar o CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analisar e enviar os resultados
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
